[project]
collection = "FAU-plattform"
default_human = "owner"
visibility = "users"

[workflow]
lanes = ["Inbox", "Backlog", "Ready", "In Progress", "Waiting", "Blocked", "Review", "Done"]
inbox = "Inbox"
backlog = "Backlog"
ready = "Ready"
doing = "In Progress"
waiting = "Waiting"
blocked = "Blocked"
review = "Review"
done = "Done"

[interviews]
card_granularity = "topic"

[templates]
work = "Purpose/outcome:\nNext action:\nAcceptance:"
code = "Change:\nAcceptance:"

[completion]
require_result = true
require_review = true

[history]
require_archive_reference = true
path = "docs/planning-decisions.md"

[compatibility]
# legacy_cache_path = "/absolute/path/to/pre-0.2/favro-state.json"
allow_unassigned_handoffs = false

