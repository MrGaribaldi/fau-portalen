[workspace]
resolver = "2"
members = ["crates/domain", "crates/persistence", "crates/app", "crates/register-sources", "crates/crypto", "crates/keys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "proprietary"
publish = false

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.4"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "process"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
vaultrs = "0.8"
zeroize = "1"

[workspace.dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"]

[profile.release]
strip = "debuginfo"
