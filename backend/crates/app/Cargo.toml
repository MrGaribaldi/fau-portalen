[package]
name = "fau-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fau"
path = "src/main.rs"

[features]
# Routes used only by integration tests exercising behaviour that is hard to trigger
# through the ordinary HTTP surface -- a future graceful-shutdown test, and today
# `/test/panic` for tests/panic_handling.rs. Never enabled in the built image.
test-routes = []

[dependencies]
fau-domain = { path = "../domain" }
fau-persistence = { path = "../persistence" }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Test-only HTTP client for the integration-test harness (`ServeHandle`). rustls,
# no default features: no reliance on the platform's native TLS stack, matching the
# app's own `sqlx` TLS backend.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Test-only: sends SIGTERM to a spawned `fau serve` child, the same signal a
# container runtime sends on shutdown (design section 12).
nix = { version = "0.31", features = ["signal"] }
# Extra tokio feature for the harness's stdout/stderr line capture
# (`AsyncBufReadExt`), on top of the workspace's shared feature set.
tokio = { workspace = true, features = ["io-util"] }
