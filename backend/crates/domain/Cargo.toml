# The domain crate. ADR-001: the domain does not depend on HTTP or UI, and this
# manifest is where that rule is enforced -- a test in tests/dependency_boundary.rs
# reads this file and fails if an HTTP or SQL dependency is ever added.
[package]
name = "fau-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Locale-aware ordering of decrypted names in the member directory (#3502, #3439): ICU4X,
# the Unicode Consortium's library, with CLDR's per-locale collation data compiled in.
# icu_locale_core and most of ICU4X's support crates are already in Cargo.lock through
# `url`'s IDNA support.
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
unicode-normalization = { workspace = true }
# Membership and group ids in the member directory's listing (#3502).
uuid = { workspace = true }

[features]
# The sync planner's test builders and in-memory applier (`register::sync::testkit`), for
# the persistence parity tests in fau-app. Only ever enabled from a dev-dependency, which
# resolver 2 keeps out of every non-test build, so it never reaches the release binary.
testkit = []

[dev-dependencies]
serde_json = { workspace = true }
